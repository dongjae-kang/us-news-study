name: Build and deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      notify_date:
        description: "Resend the phone notification for this day (YYYY-MM-DD); empty = none"
        required: false
        default: ""
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install markdown==3.11
      - run: python build.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Notify phone (new day only, delivered 08:00 New York)
        if: github.event_name == 'push' || github.event.inputs.notify_date != ''
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          BEFORE: ${{ github.event.before }}
          FORCE_DATE: ${{ github.event.inputs.notify_date }}
        run: python notify.py
